name: render
on:
  workflow_dispatch:
    inputs:
      scenes:
        required: true
      tag:
        required: true
      topic:
        required: false
        default: ''
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - run: pip install edge-tts
      - run: npm install --no-save puppeteer
      - name: Render
        env:
          SCENES: ${{ inputs.scenes }}
          TOPIC: ${{ inputs.topic }}
        run: node render.js
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TOPIC: ${{ inputs.topic }}
        run: gh release create "$TAG" reel.mp4 --title "$TAG" --notes "${TOPIC:-reel}"
